name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ scripts/ tests/

      - name: Tests
        run: pytest tests/ -v --tb=short

  # requirements.txt pins the exact stack the thesis results come from; the
  # job above only tests the pyproject floors. Install the pins as-is so a
  # bump that breaks the pinned set fails here.
  test-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          pip install -r requirements.txt pytest
          pip install --no-deps -e .

      - name: Tests
        run: pytest tests/ -v --tb=short
